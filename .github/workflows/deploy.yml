# Fetch the latest Phelps menus and publish web/ to GitHub Pages.
# Runs on every push to main and once a day, so the hosted menu stays current.
name: Fetch menus and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 10 * * *" # 10:00 UTC = 6 AM Eastern (5 AM in winter)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Actions are pinned to exact commits (tags can be moved); Dependabot proposes updates.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Fetch menus
        run: |
          pip install -r requirements.txt
          python fetch_phelps.py --days 14

      # Give the service worker a new cache name per commit so phones pick up app changes.
      - name: Stamp service worker version
        run: sed -i "s/const VERSION = \"v1\"/const VERSION = \"${GITHUB_SHA::7}\"/" web/sw.js

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
