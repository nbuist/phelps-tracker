# Fetch the latest Phelps menus and publish web/ to GitHub Pages.
# Runs on every push to main and once a day, so the hosted menu stays current.
name: Fetch menus and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 10 * * *" # 10:00 UTC = 6 AM Eastern (5 AM in winter)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Actions are pinned to exact commits (tags can be moved); Dependabot proposes updates.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Fetch menus
        run: |
          pip install -r requirements.txt
          python fetch_phelps.py --days 14

      # Give the service worker a new cache name per commit so phones pick up app changes.
      - name: Stamp service worker version
        run: sed -i "s/const VERSION = \"v1\"/const VERSION = \"${GITHUB_SHA::7}\"/" web/sw.js

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
